name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e ".[dev,ml]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
      - name: Enforce adversarial evaluation gate
        run: >-
          python scripts/check_evaluation_gate.py
          --model-version sentinel-max-ensemble-v1
      - name: Generate reproducible CycloneDX SBOM
        run: python scripts/generate_sbom.py
      - name: Require lockfile and SBOM consistency
        run: git diff --exit-code -- artifacts/security/sbom.cdx.json
      - name: Enforce repository security policy
        run: python scripts/check_security_configuration.py
      - name: Upload SBOM evidence
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-cyclonedx-sbom
          path: artifacts/security/sbom.cdx.json
          if-no-files-found: error
