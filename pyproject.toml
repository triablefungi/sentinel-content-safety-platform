[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sentinel-content-safety-platform"
version = "0.1.0"
description = "A production-oriented content safety platform for user-generated content."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic>=2.10,<3.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.3,<9.0",
  "pytest-cov>=6.0,<7.0",
  "ruff>=0.9,<1.0",
]
ml = [
  "datasets>=4.0,<5.0",
  "joblib>=1.4,<2.0",
  "pandas>=2.2,<3.0",
  "scikit-learn>=1.6,<2.0",
]
inference = [
  "joblib>=1.4,<2.0",
  "scikit-learn>=1.6,<2.0",
]
transformer = [
  "accelerate>=1.0,<2.0",
  "torch>=2.7,<3.0",
  "transformers>=4.55,<6.0",
]
distributed = [
  "confluent-kafka>=2.12,<3.0",
  "redis>=6.4,<9.0",
]
threat-intelligence = [
  "qdrant-client>=1.15,<2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel"]

[tool.pytest.ini_options]
addopts = "-q --cov=sentinel --cov-report=term-missing"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
