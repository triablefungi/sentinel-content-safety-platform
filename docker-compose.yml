x-sentinel-environment: &sentinel-environment
  SENTINEL_DISTRIBUTED_ENABLED: "true"
  SENTINEL_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  SENTINEL_REDIS_URL: redis://redis:6379/0
  SENTINEL_QDRANT_URL: http://qdrant:6333
  SENTINEL_QDRANT_COLLECTION: sentinel-threat-signals-v1
  SENTINEL_MODEL_PATH: /app/artifacts/models/toxicity_baseline.joblib
  SENTINEL_TRANSFORMER_MODEL_PATH: /app/artifacts/models/disabled-transformer
  SENTINEL_IMAGE_MODEL_PATH: /app/artifacts/models/image_safety
  SENTINEL_REVIEW_ENABLED: "true"
  SENTINEL_REVIEW_AUTH_PATH: /app/config/reviewer-auth.json
  SENTINEL_REVIEW_LEDGER_PATH: /app/artifacts/review/review-ledger.jsonl
  SENTINEL_ENVIRONMENT: development
  SENTINEL_DOCS_ENABLED: "true"
  SENTINEL_HSTS_ENABLED: "false"
  SENTINEL_MAX_REQUEST_BYTES: "8388608"
  SENTINEL_RATE_LIMIT_ENABLED: "true"
  SENTINEL_RATE_LIMIT_REQUESTS: "120"
  SENTINEL_RATE_LIMIT_WINDOW_SECONDS: "60"

services:
  kafka:
    image: apache/kafka:4.2.1
    ports:
      - "127.0.0.1:29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  kafka-init:
    image: apache/kafka:4.2.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create \
          --if-not-exists --topic sentinel.moderation.input.v1 --partitions 3 \
          --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create \
          --if-not-exists --topic sentinel.moderation.retry.v1 --partitions 3 \
          --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create \
          --if-not-exists --topic sentinel.moderation.result.v1 --partitions 3 \
          --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create \
          --if-not-exists --topic sentinel.moderation.dlq.v1 --partitions 3 \
          --replication-factor 1

  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.15.5
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /healthz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && grep -q \"200 OK\" <&3'",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment: *sentinel-environment
    volumes:
      - ./artifacts/models:/app/artifacts/models:ro
      - ./config/reviewer-auth.example.json:/app/config/reviewer-auth.json:ro
      - review-data:/app/artifacts/review
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  worker:
    build: .
    command: python -m sentinel.worker
    environment: *sentinel-environment
    volumes:
      - ./artifacts/models:/app/artifacts/models:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      api:
        condition: service_started
      worker:
        condition: service_started

  grafana:
    image: grafana/grafana:12.1.1
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  redis-data:
  qdrant-data:
  prometheus-data:
  grafana-data:
  review-data:
